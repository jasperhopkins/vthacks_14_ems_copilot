AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'EMS Copilot -- voice-to-PCR, protocol/dosage assistant, medical translator,
  and drug interaction reference, built on HIPAA-eligible AWS services. See docs/HIPAA_NOTES.md
  before this touches any real patient data: eligible infrastructure + a signed BAA
  is necessary but not sufficient for actual HIPAA compliance.

  '
Parameters:
  Stage:
    Type: String
    Default: dev
  BedrockModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
    Description: Must be a Bedrock model confirmed BAA-covered before real PHI use.
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ENCOUNTERS_TABLE_NAME:
          Ref: EncountersTable
        ENCOUNTERS_BY_USER_INDEX: ByUserSaved
        AUDIT_TABLE_NAME:
          Ref: AuditLogTable
        PROTOCOL_TABLE_NAME:
          Ref: ProtocolTable
        DRUG_TABLE_NAME:
          Ref: DrugReferenceTable
        AUDIO_BUCKET_NAME:
          Ref: AudioBucket
        BEDROCK_MODEL_ID:
          Ref: BedrockModelId
        KMS_KEY_ARN:
          Fn::GetAtt:
          - EmsCopilotKmsKey
          - Arn
Resources:
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ems-copilot-common-${Stage}
      ContentUri: ../../layers/common
      CompatibleRuntimes:
      - python3.12
  EmsCopilotKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for EMS Copilot PHI-adjacent data at rest
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowAccountAdmin
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: ems-copilot-${Stage}
      MfaConfiguration: OPTIONAL
      EnabledMfas:
      - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AutoVerifiedAttributes:
      - email
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      ClientName:
        Fn::Sub: ems-copilot-mobile-${Stage}
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_PASSWORD_AUTH
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName:
        Fn::Sub: ems_copilot_${Stage}
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
      - ClientId:
          Ref: UserPoolClient
        ProviderName:
          Fn::GetAtt:
          - UserPool
          - ProviderName
        ServerSideTokenCheck: true
  TranscribeStreamingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: cognito-identity.amazonaws.com
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              cognito-identity.amazonaws.com:aud:
                Ref: IdentityPool
            ForAnyValue:StringLike:
              cognito-identity.amazonaws.com:amr: authenticated
      Policies:
      - PolicyName: TranscribeStreamOnly
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: StreamingTranscriptionOnly
            Effect: Allow
            Action:
            - transcribe:StartStreamTranscriptionWebSocket
            Resource: '*'
  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId:
        Ref: IdentityPool
      Roles:
        authenticated:
          Fn::GetAtt:
          - TranscribeStreamingRole
          - Arn
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: Stage
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - Authorization
        - Content-Type
        AllowMethods:
        - GET
        - POST
        - OPTIONS
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
              - Ref: UserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer
  EncountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ems-copilot-encounters-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: encounter_id
        AttributeType: S
      - AttributeName: created_by
        AttributeType: S
      - AttributeName: saved_at
        AttributeType: N
      KeySchema:
      - AttributeName: encounter_id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: ByUserSaved
        KeySchema:
        - AttributeName: created_by
          KeyType: HASH
        - AttributeName: saved_at
          KeyType: RANGE
        Projection:
          ProjectionType: INCLUDE
          NonKeyAttributes:
          - summary_chief_complaint
          - summary_meds
          - patient_label
          - flag_count
          - search_text
          - created_at
          - capture_mode
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId:
          Ref: EmsCopilotKmsKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ems-copilot-audit-log-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: encounter_id
        AttributeType: S
      - AttributeName: sort_key
        AttributeType: S
      KeySchema:
      - AttributeName: encounter_id
        KeyType: HASH
      - AttributeName: sort_key
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId:
          Ref: EmsCopilotKmsKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  ProtocolTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ems-copilot-protocols-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: protocol_id
        AttributeType: S
      KeySchema:
      - AttributeName: protocol_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId:
          Ref: EmsCopilotKmsKey
  DrugReferenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ems-copilot-drug-reference-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: drug_name
        AttributeType: S
      KeySchema:
      - AttributeName: drug_name
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId:
          Ref: EmsCopilotKmsKey
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ems-copilot-audio-${Stage}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: aws:kms
            KMSMasterKeyID:
              Ref: EmsCopilotKmsKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: ExpireRawAudio
          Status: Enabled
          ExpirationInDays: 7
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ems-copilot-cloudtrail-${Stage}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: aws:kms
            KMSMasterKeyID:
              Ref: EmsCopilotKmsKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: CloudTrailBucket
      PolicyDocument:
        Statement:
        - Sid: AWSCloudTrailAclCheck
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:GetBucketAcl
          Resource:
            Fn::GetAtt:
            - CloudTrailBucket
            - Arn
        - Sid: AWSCloudTrailWrite
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:PutObject
          Resource:
            Fn::Sub: ${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
          Condition:
            StringEquals:
              s3:x-amz-acl: bucket-owner-full-control
  EmsCopilotTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName:
        Fn::Sub: ems-copilot-${Stage}
      S3BucketName:
        Ref: CloudTrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors:
      - ReadWriteType: All
        IncludeManagementEvents: true
  EncounterFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: EmsCopilotAppAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: EncountersReadWrite
            Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            Resource:
            - Fn::GetAtt:
              - EncountersTable
              - Arn
            - Fn::GetAtt:
              - ProtocolTable
              - Arn
            - Fn::GetAtt:
              - DrugReferenceTable
              - Arn
          - Sid: EncountersUpdate
            Effect: Allow
            Action:
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - EncountersTable
              - Arn
          - Sid: EncountersIndexQuery
            Effect: Allow
            Action:
            - dynamodb:Query
            Resource:
              Fn::Sub: ${EncountersTable.Arn}/index/*
          - Sid: AuditAppendOnly
            Effect: Allow
            Action:
            - dynamodb:PutItem
            Resource:
              Fn::GetAtt:
              - AuditLogTable
              - Arn
          - Sid: KmsUse
            Effect: Allow
            Action:
            - kms:Encrypt
            - kms:Decrypt
            - kms:GenerateDataKey
            - kms:DescribeKey
            Resource:
              Fn::GetAtt:
              - EmsCopilotKmsKey
              - Arn
          - Sid: S3Audio
            Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            Resource:
              Fn::Sub: ${AudioBucket.Arn}/*
          - Sid: S3AudioBucket
            Effect: Allow
            Action:
            - s3:ListBucket
            Resource:
              Fn::GetAtt:
              - AudioBucket
              - Arn
          - Sid: TranscribeAccess
            Effect: Allow
            Action:
            - transcribe:StartTranscriptionJob
            - transcribe:GetTranscriptionJob
            Resource: '*'
          - Sid: SelfInvokeForAsyncExtraction
            Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*
          - Sid: BedrockInvoke
            Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource: '*'
          - Sid: ComprehendMedicalAccess
            Effect: Allow
            Action:
            - comprehendmedical:InferRxNorm
            - comprehendmedical:DetectEntitiesV2
            Resource: '*'
          - Sid: TranslateAndPolly
            Effect: Allow
            Action:
            - translate:TranslateText
            - polly:SynthesizeSpeech
            Resource: '*'
  PcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrFunction
      Handler: app.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        GenerateApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/generate
            Method: POST
    Metadata:
      SamResourceId: PcrFunction
  PcrChunkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrChunkFunction
      Handler: chunk.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        ChunkApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/stream-chunk
            Method: POST
    Metadata:
      SamResourceId: PcrChunkFunction
  PcrLiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrLiveFunction
      Handler: live.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        LiveApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/{encounter_id}/live
            Method: GET
    Metadata:
      SamResourceId: PcrLiveFunction
  PcrFinalizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrFinalizeFunction
      Handler: finalize.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Timeout: 300
      Events:
        FinalizeApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/finalize
            Method: POST
    Metadata:
      SamResourceId: PcrFinalizeFunction
  PcrCommitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrCommitFunction
      Handler: records.commit_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        CommitApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/{encounter_id}/commit
            Method: POST
    Metadata:
      SamResourceId: PcrCommitFunction
  PcrListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrListFunction
      Handler: records.list_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/saved
            Method: GET
    Metadata:
      SamResourceId: PcrListFunction
  PcrUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrUploadUrlFunction
      Handler: upload_url.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        UploadUrlApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/upload-url
            Method: GET
    Metadata:
      SamResourceId: PcrUploadUrlFunction
  PcrStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PcrStatusFunction
      Handler: status.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        StatusApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /pcr/{encounter_id}
            Method: GET
    Metadata:
      SamResourceId: PcrStatusFunction
  ProtocolFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ProtocolFunction
      Handler: app.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        QueryApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /protocol/query
            Method: POST
    Metadata:
      SamResourceId: ProtocolFunction
  ProtocolListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ProtocolListFunction
      Handler: browse.list_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /protocol/list
            Method: GET
    Metadata:
      SamResourceId: ProtocolListFunction
  ProtocolDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ProtocolDetailFunction
      Handler: browse.detail_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        DetailApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /protocol/{protocol_id}
            Method: GET
    Metadata:
      SamResourceId: ProtocolDetailFunction
  DrugListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DrugListFunction
      Handler: browse.list_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /drug/list
            Method: GET
    Metadata:
      SamResourceId: DrugListFunction
  DrugInteractionListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DrugInteractionListFunction
      Handler: browse.interactions_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /drug/interactions
            Method: GET
    Metadata:
      SamResourceId: DrugInteractionListFunction
  TranslateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: TranslateFunction
      Handler: app.handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        TranslateApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /translate
            Method: POST
    Metadata:
      SamResourceId: TranslateFunction
  DrugLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DrugLookupFunction
      Handler: app.lookup_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        LookupApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /drug/lookup
            Method: POST
    Metadata:
      SamResourceId: DrugLookupFunction
  DrugInteractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DrugInteractionFunction
      Handler: app.interaction_handler
      Role:
        Fn::GetAtt:
        - EncounterFunctionsRole
        - Arn
      Layers:
      - Ref: CommonLayer
      Events:
        InteractionApi:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /drug/check-interaction
            Method: POST
    Metadata:
      SamResourceId: DrugInteractionFunction
Outputs:
  ApiUrl:
    Description: Base URL for the API -- put this in mobile/src/config.js
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value:
      Ref: UserPool
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
  IdentityPoolId:
    Description: Cognito identity pool -- put this in mobile/src/config.js
    Value:
      Ref: IdentityPool
  AudioBucketName:
    Value:
      Ref: AudioBucket
  KmsKeyArn:
    Value:
      Fn::GetAtt:
      - EmsCopilotKmsKey
      - Arn
