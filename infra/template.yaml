AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  EMS Copilot -- voice-to-PCR, protocol/dosage assistant, medical translator,
  and drug interaction reference, built on HIPAA-eligible AWS services.
  See docs/HIPAA_NOTES.md before this touches any real patient data: eligible
  infrastructure + a signed BAA is necessary but not sufficient for actual
  HIPAA compliance.

Parameters:
  Stage:
    Type: String
    Default: dev
  BedrockModelId:
    Type: String
    # Handlers call Bedrock through the Converse API, so this can be any
    # Converse-capable text model without a code change.
    # Nova Pro was picked by evaluating candidates on realistic ASR-style
    # transcripts (infra/tests/eval_models.py): it was the cheapest model
    # that never fabricated a vital, dose, or intervention. nova-2-lite
    # invented interventions on a patient-refusal transcript, so don't
    # "upgrade" to it without re-running that eval. Anthropic models
    # on Bedrock need a use-case form submitted per account and are
    # inference-profile-only (the "us." prefix); Nova is AWS first-party
    # and needs neither. See what this account can invoke with:
    #   aws bedrock list-foundation-models
    Default: amazon.nova-pro-v1:0
    Description: Must be a Bedrock model confirmed BAA-covered before real PHI use.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60          # Transcribe polling in pcr/app.py needs headroom
    MemorySize: 256
    Tracing: Active       # X-Ray -- extra audit/debug trail, not a substitute for the audit table
    Environment:
      Variables:
        ENCOUNTERS_TABLE_NAME: !Ref EncountersTable
        ENCOUNTERS_BY_USER_INDEX: ByUserSaved
        AUDIT_TABLE_NAME: !Ref AuditLogTable
        PROTOCOL_TABLE_NAME: !Ref ProtocolTable
        DRUG_TABLE_NAME: !Ref DrugReferenceTable
        AUDIO_BUCKET_NAME: !Ref AudioBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        KMS_KEY_ARN: !GetAtt EmsCopilotKmsKey.Arn

Resources:

  # ---------------------------------------------------------------------
  # Shared code layer -- common/audit.py and common/responses.py are used
  # by every function (see the "from common.audit import ..." imports).
  # Packaged as a layer rather than duplicated per-function so the audit
  # logging logic has exactly one implementation to review/trust.
  # ---------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "ems-copilot-common-${Stage}"
      ContentUri: layers/common/
      CompatibleRuntimes: [python3.12]
    # No BuildMethod on purpose. ContentUri already has the python/ prefix
    # Lambda requires, and BuildMethod: python3.12 nests it a second time
    # (/opt/python/python/common), which import can't see. Add one back
    # only if this layer ever gains third-party deps, and drop the python/
    # directory from the source tree at the same time.

  # ---------------------------------------------------------------------
  # Encryption -- one CMK for everything below. Using a customer-managed
  # key (not the AWS-managed default) is what lets you control/rotate/
  # revoke access independently of AWS, which auditors expect to see.
  # ---------------------------------------------------------------------
  EmsCopilotKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for EMS Copilot PHI-adjacent data at rest
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  # ---------------------------------------------------------------------
  # Auth -- every API call must carry a Cognito-issued JWT. This is what
  # makes "who did what" in the audit log meaningful (see common/responses.py
  # get_user_id, which pulls the Cognito `sub` out of the verified claims).
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "ems-copilot-${Stage}"
      MfaConfiguration: "OPTIONAL"   # flip to REQUIRED before this is anything but a demo
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AutoVerifiedAttributes: [email]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "ems-copilot-mobile-${Stage}"
      GenerateSecret: false     # public client (mobile app) -- no secret to leak
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # SRP is the better flow on paper -- the password never leaves the
        # device -- but it's unusable here: amazon-cognito-identity-js does
        # SRP in pure JS, and its two 3072-bit modPow operations cost ~300ms
        # on V8 *with* a JIT. Hermes has none, so sign-in froze the UI for
        # tens of seconds. USER_PASSWORD_AUTH sends the password to Cognito
        # over TLS instead and returns in well under a second. Revisit with
        # a native crypto module if this ever leaves hackathon scope --
        # see docs/HIPAA_NOTES.md.
        - ALLOW_USER_PASSWORD_AUTH

  # ---------------------------------------------------------------------
  # Identity pool: the ONLY thing in this stack that hands real AWS
  # credentials to the device.
  #
  # Live transcription needs it. Transcribe's streaming API is a WebSocket
  # that the caller signs with SigV4, and only the phone can sign it --
  # there is no way to proxy a continuous PCM stream through API Gateway +
  # Lambda, which are request/response. So the app trades its Cognito ID
  # token for temporary credentials here.
  #
  # Those credentials are deliberately near-useless for anything else: the
  # authenticated role below grants exactly one action, on a service that
  # stores nothing. It cannot touch DynamoDB, S3, or Bedrock -- every path
  # to patient data still goes through API Gateway's JWT authorizer and the
  # Lambda role. Unauthenticated identities are off, so a caller must
  # already hold a valid user-pool token to get anything at all.
  # See docs/HIPAA_NOTES.md item 8 before changing any of this.
  # ---------------------------------------------------------------------
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "ems_copilot_${Stage}"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName
          ServerSideTokenCheck: true

  TranscribeStreamingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: cognito-identity.amazonaws.com }
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              # Without BOTH conditions this role would be assumable by any
              # Cognito identity in any account, not just ours.
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: TranscribeStreamOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StreamingTranscriptionOnly
                Effect: Allow
                Action: [transcribe:StartStreamTranscriptionWebSocket]
                Resource: "*"

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt TranscribeStreamingRole.Arn

  # ---------------------------------------------------------------------
  # API Gateway (HTTP API) with a Cognito JWT authorizer on every route.
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]      # tighten before anything but a hackathon demo
        AllowHeaders: ["Authorization", "Content-Type"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # DynamoDB tables
  # ---------------------------------------------------------------------
  EncountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ems-copilot-encounters-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: encounter_id
          AttributeType: S
        - AttributeName: created_by
          AttributeType: S
        - AttributeName: saved_at
          AttributeType: N
      KeySchema:
        - AttributeName: encounter_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        # "My PCRs, newest first." Deliberately SPARSE: saved_at is written
        # only by POST /pcr/{id}/commit, so in-flight recordings, drafts the
        # medic never accepted, and failed transcriptions are physically
        # absent from this index rather than filtered out of it -- the list
        # screen cannot accidentally show an unreviewed PCR.
        #
        # Projection is INCLUDE, not ALL: every encounter item carries a
        # full transcript, and ALL would duplicate all of them into the
        # index for a list view that only renders a one-line summary. The
        # projected attributes are the flat ones written by
        # common/pcr.py:build_summary_attrs (a GSI cannot project a nested
        # path, which is why they are flat in the first place).
        - IndexName: ByUserSaved
          KeySchema:
            - AttributeName: created_by
              KeyType: HASH
            - AttributeName: saved_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - summary_chief_complaint
              - summary_meds
              - patient_label
              - flag_count
              - search_text
              - created_at
              - capture_mode
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref EmsCopilotKmsKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Append-only by IAM contract: see EncounterFunctionsRole below, which is
  # granted PutItem/GetItem/Query but explicitly NOT UpdateItem/DeleteItem
  # on this table.
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ems-copilot-audit-log-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: encounter_id
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: encounter_id
          KeyType: HASH
        - AttributeName: sort_key
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref EmsCopilotKmsKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProtocolTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ems-copilot-protocols-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: protocol_id
          AttributeType: S
      KeySchema:
        - AttributeName: protocol_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref EmsCopilotKmsKey

  DrugReferenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ems-copilot-drug-reference-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: drug_name
          AttributeType: S
      KeySchema:
        - AttributeName: drug_name
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref EmsCopilotKmsKey

  # ---------------------------------------------------------------------
  # S3 for raw audio uploads (source for Transcribe). Encrypted, versioned,
  # public access fully blocked, short lifecycle so raw audio (highest-
  # sensitivity artifact in this whole system) doesn't linger.
  # ---------------------------------------------------------------------
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ems-copilot-audio-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref EmsCopilotKmsKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawAudio
            Status: Enabled
            ExpirationInDays: 7   # tune for your real retention policy

  # ---------------------------------------------------------------------
  # CloudTrail -- account/API-level audit trail, distinct from (and in
  # addition to) the application-level AuditLogTable. This one is your
  # evidence of *infrastructure* access (who changed IAM, who read S3
  # directly, etc); the DynamoDB one is your evidence of *application*
  # actions (who looked at which patient encounter).
  # ---------------------------------------------------------------------
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ems-copilot-cloudtrail-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref EmsCopilotKmsKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: "s3:GetBucketAcl"
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: "s3:PutObject"
            Resource: !Sub "${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals: { "s3:x-amz-acl": "bucket-owner-full-control" }

  EmsCopilotTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub "ems-copilot-${Stage}"
      S3BucketName: !Ref CloudTrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      # CloudTrail rejects a multi-region trail that excludes global
      # service events, and CloudFormation defaults this to false.
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true   # cryptographic proof logs weren't altered
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true

  # ---------------------------------------------------------------------
  # IAM -- one shared role for the application Lambdas. Deliberately
  # NO UpdateItem/DeleteItem on the audit table: that's what makes it
  # append-only in practice, not just in naming.
  # ---------------------------------------------------------------------
  EncounterFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmsCopilotAppAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EncountersReadWrite
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:Query, dynamodb:Scan]
                Resource:
                  - !GetAtt EncountersTable.Arn
                  - !GetAtt ProtocolTable.Arn
                  - !GetAtt DrugReferenceTable.Arn
              # UpdateItem is scoped to the encounters table alone, not
              # folded into the statement above, so the protocol and drug
              # reference tables stay read-only to these functions.
              # Chunked capture needs it: concurrent chunk uploads write
              # sibling keys of one DynamoDB map, and a read-modify-write
              # PutItem would drop whichever landed in between.
              - Sid: EncountersUpdate
                Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt EncountersTable.Arn
              - Sid: EncountersIndexQuery
                Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub "${EncountersTable.Arn}/index/*"
              - Sid: AuditAppendOnly
                Effect: Allow
                Action: [dynamodb:PutItem]   # deliberately no Update/Delete
                Resource: !GetAtt AuditLogTable.Arn
              - Sid: KmsUse
                Effect: Allow
                # DescribeKey: Transcribe validates OutputEncryptionKMSKeyId
                # before it will start a job against an SSE-KMS bucket.
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt EmsCopilotKmsKey.Arn
              - Sid: S3Audio
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${AudioBucket.Arn}/*"
              - Sid: S3AudioBucket
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt AudioBucket.Arn
              - Sid: TranscribeAccess
                Effect: Allow
                Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob]
                Resource: "*"
              # Extraction is moved off the request path by invoking the
              # finalize function again asynchronously -- see the docstring
              # in src/pcr/finalize.py. Scoped by name pattern rather than
              # !GetAtt on the function, which would be a circular
              # dependency (function -> role -> function).
              - Sid: SelfInvokeForAsyncExtraction
                Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*"
              - Sid: BedrockInvoke
                Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: "*"
              - Sid: ComprehendMedicalAccess
                Effect: Allow
                Action: [comprehendmedical:InferRxNorm, comprehendmedical:DetectEntitiesV2]
                Resource: "*"
              - Sid: TranslateAndPolly
                Effect: Allow
                Action: [translate:TranslateText, polly:SynthesizeSpeech]
                Resource: "*"

  # ---------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------
  PcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: app.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        GenerateApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/generate
            Method: POST

  # ---- Chunked live transcription (chunk -> live -> finalize) --------
  # Expo Go cannot hand us raw PCM frames, so Transcribe's streaming API is
  # off the table; the app records short consecutive clips instead and the
  # transcript grows a chunk at a time. See src/pcr/chunk.py.
  PcrChunkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: chunk.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        ChunkApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/stream-chunk
            Method: POST

  PcrLiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: live.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        LiveApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/{encounter_id}/live
            Method: GET

  PcrFinalizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: finalize.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      # Runs both sides of the split: the fast API call, and the async
      # worker invocation that actually calls Bedrock. The worker is this
      # same function re-invoked via context.function_name, so it needs
      # room for a long transcript -- well past the API's 30s ceiling,
      # which is the whole reason for the split.
      Timeout: 300
      Events:
        FinalizeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/finalize
            Method: POST

  # ---- The durable PCR store ------------------------------------------
  PcrCommitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: records.commit_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        CommitApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/{encounter_id}/commit
            Method: POST

  # Routed as the static /pcr/saved rather than a query flag on
  # /pcr/{encounter_id}: HTTP API route selection prefers the route with
  # more static segments, so this wins over the path-variable route without
  # ambiguity.
  PcrListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: records.list_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/saved
            Method: GET

  PcrUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: upload_url.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        UploadUrlApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/upload-url
            Method: GET

  # Poll target for the PCR pipeline. Finishes the job (Bedrock extraction
  # + drug cross-check) on the first poll that finds Transcribe done -- see
  # the docstring in src/pcr/status.py for why this is split from generate.
  PcrStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/pcr/
      Handler: status.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        StatusApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pcr/{encounter_id}
            Method: GET

  ProtocolFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/protocol/
      Handler: app.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        QueryApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /protocol/query
            Method: POST

  # Browse the protocol library rather than searching it. Static
  # /protocol/list is declared alongside the greedy /protocol/{protocol_id};
  # HTTP APIs route the more specific literal path first, so "list" is never
  # swallowed as a protocol id.
  ProtocolListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/protocol/
      Handler: browse.list_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /protocol/list
            Method: GET

  ProtocolDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/protocol/
      Handler: browse.detail_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        DetailApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /protocol/{protocol_id}
            Method: GET

  DrugListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/drug/
      Handler: browse.list_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drug/list
            Method: GET

  # Every flagged pair in the formulary, for browsing rather than asking.
  # Shares the scan-and-pair logic with the interaction check so the list
  # and a one-off check can never disagree.
  DrugInteractionListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/drug/
      Handler: browse.interactions_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drug/interactions
            Method: GET

  TranslateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/translate/
      Handler: app.handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        TranslateApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /translate
            Method: POST

  DrugLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/drug/
      Handler: app.lookup_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        LookupApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drug/lookup
            Method: POST

  DrugInteractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/drug/
      Handler: app.interaction_handler
      Role: !GetAtt EncounterFunctionsRole.Arn
      Layers: [!Ref CommonLayer]
      Events:
        InteractionApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drug/check-interaction
            Method: POST

Outputs:
  ApiUrl:
    Description: Base URL for the API -- put this in mobile/src/config.js
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  IdentityPoolId:
    Description: Cognito identity pool -- put this in mobile/src/config.js
    Value: !Ref IdentityPool
  AudioBucketName:
    Value: !Ref AudioBucket
  KmsKeyArn:
    Value: !GetAtt EmsCopilotKmsKey.Arn
